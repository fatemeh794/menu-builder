server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    # ^~ forces this prefix match to win over the regex image-extension
    # location below - without it, nginx's regex-location-wins-over-prefix
    # rule would route */media/*.jpg straight into that block's try_files
    # against the SPA root instead of here, and 404.
    location ^~ /media/ {
        # Django only serves /media/ itself when DEBUG=True; this
        # container runs config.settings.prod, so gunicorn has no
        # route for it at all. nginx serves it directly instead from
        # the same named volume the backend writes uploads into.
        alias /usr/share/nginx/media/;
    }

    # Without an explicit Cache-Control, browsers apply heuristic caching to
    # these (no headers = fair game), and ngx-translate's forRoot eager-load
    # plus its own translate.use() call can each fire a separate request for
    # the same file - if one gets served a stale cached copy right after a
    # deploy, that request's keys look "missing" while everything else on
    # the page translates fine. no-cache forces a cheap revalidation (ETag)
    # every time instead of ever trusting a stale copy.
    location /assets/i18n/ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /ngsw-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
