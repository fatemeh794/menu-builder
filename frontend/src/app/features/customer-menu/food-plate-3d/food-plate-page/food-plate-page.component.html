<div class="plate3d-page relative flex h-[100dvh] flex-col overflow-hidden bg-[#0f1115] text-white">
  <header class="flex items-center gap-3 px-5 pt-[calc(0.9rem+var(--safe-top))] pb-3">
    <button
      type="button"
      (click)="goBack()"
      aria-label="back"
      class="flex h-10 w-10 items-center justify-center rounded-full bg-white/10 transition-colors hover:bg-white/20"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="min-w-0">
      <h1 class="truncate text-lg font-extrabold">{{ 'plate3d.title' | translate }}</h1>
      <p class="truncate text-xs text-white/50">{{ 'plate3d.subtitle' | translate }}</p>
    </div>
  </header>

  <!-- 3D hero zone -->
  <div class="relative min-h-0 flex-1">
    <app-food-plate />

    <div class="pointer-events-none absolute inset-x-0 top-3 flex justify-center px-4 md:justify-end md:pe-6">
      <div class="pointer-events-auto w-full max-w-xs">
        <app-meal-summary (addToCart)="addToCart()" />
      </div>
    </div>

    @if (justAdded()) {
      <div
        class="absolute inset-x-0 bottom-4 mx-auto flex w-fit items-center gap-2 rounded-full bg-emerald-500/90 px-4 py-2 text-sm font-semibold shadow-lg"
      >
        <mat-icon style="font-size: 18px; width: 18px; height: 18px">check_circle</mat-icon>
        {{ 'plate3d.added' | translate }}
      </div>
    }
  </div>

  <!-- Ingredient picker: a horizontal carousel on mobile, a wider deck on
       desktop - same component and markup, purely responsive CSS. -->
  <div class="shrink-0 border-t border-white/10 bg-white/[0.03] px-4 py-4 pb-[calc(1rem+var(--safe-bottom))]">
    <app-food-selector (ingredientTapAdd)="onIngredientTapAdd($event)" (ingredientPointerDown)="onIngredientPointerDown($event)" />
  </div>

  @if (ghost(); as g) {
    <div
      class="pointer-events-none fixed z-50 flex h-14 w-14 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white/90 text-2xl shadow-2xl"
      [style.left.px]="g.x"
      [style.top.px]="g.y"
    >
      {{ g.ingredient.icon }}
    </div>
  }
</div>
