<button
  type="button"
  draggable="true"
  (dragstart)="onDragStart($event)"
  (pointerdown)="pointerDown.emit($event)"
  (click)="tapAdd.emit(ingredient())"
  class="group flex shrink-0 flex-col items-center gap-2 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 backdrop-blur-sm transition-all duration-200 hover:-translate-y-1 hover:border-white/20 hover:bg-white/10 hover:shadow-lg hover:shadow-black/20 active:scale-95 cursor-grab active:cursor-grabbing"
>
  <span
    class="flex h-12 w-12 items-center justify-center rounded-full text-2xl shadow-inner transition-transform duration-200 group-hover:scale-110"
    [style.background]="ingredient().color + '33'"
  >
    {{ ingredient().icon }}
  </span>
  <span class="text-xs font-semibold text-white/90 whitespace-nowrap">{{ ingredient().nameKey | translate }}</span>
  <span class="text-[11px] font-medium text-white/50 ltr-nums">{{ ingredient().price | tomanPrice }}</span>
</button>
