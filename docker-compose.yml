services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_menu}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_menu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant_menu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      # Always run the container on prod settings regardless of what
      # DJANGO_SETTINGS_MODULE is set to in .env (that value is for
      # running manage.py directly on the host during development).
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      # nginx serves uploaded media directly from the same volume the
      # backend writes to - Django only serves /media/ itself in DEBUG
      # mode (that's Django's own by-design restriction), so in this
      # prod-settings container gunicorn has no route for it at all.
      - media_data:/usr/share/nginx/media:ro
    ports:
      - "8080:80"

volumes:
  postgres_data:
  media_data:
